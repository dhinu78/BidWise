<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Estimation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b2239; --green: #8cc49c; --green-strong: #3ddc84; --green-light: #9be38f; --amber: #e2c879;
    --panel: #e4e4e4; --panel-2: #d9d9d9; --line: #b9b9b9; --text: #0b2239; --muted: #5d6b78; --bg: #f4f5f7;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Outfit", system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .stripe { height: 10px; background: linear-gradient(90deg, var(--navy) 0 52%, var(--green) 52% 100%); }
  .app { max-width: 1200px; margin: 0 auto; background: #fff; min-height: calc(100vh - 10px); }

  /* header */
  header { display: flex; align-items: center; gap: 24px; padding: 14px 24px; background: var(--panel); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { height: 42px; }
  .brand .logo-text { font-weight: 600; letter-spacing: .08em; font-size: 14px; color: var(--navy); border-right: 1px solid var(--line); padding-right: 22px; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 400; letter-spacing: .04em; }
  .brand h1 b { font-weight: 700; }
  .spacer { flex: 1; }
  .project-name { display: flex; align-items: center; gap: 6px; font-size: 20px; border-bottom: 2px dotted var(--navy); padding: 0 4px 2px; max-width: 320px; }
  .project-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--navy); }
  .icon-btn .box { width: 28px; height: 28px; border: 2px solid var(--navy); border-radius: 8px; display: grid; place-items: center; background: #fff; }
  .icon-btn svg { width: 18px; height: 18px; }
  .plain-icon { background: none; border: 0; padding: 2px; color: var(--navy); display: grid; place-items: center; }
  .user { display: flex; align-items: center; gap: 8px; }
  .user .who { display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 600; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--navy); object-fit: cover; background: var(--green); display: grid; place-items: center; color: var(--navy); font-weight: 700; }

  main { padding: 22px 24px 28px; }

  /* uploads */
  .uploads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 18px; }
  .upload { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .upload label { font-weight: 600; font-size: 19px; }
  .file-chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 4px; padding: 3px 8px; }
  .file-chip .fname { flex: 1; min-width: 0; font-size: 17px; border-bottom: 2px dotted var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-chip .fname.empty { color: var(--muted); font-style: italic; }
  .file-chip .meta { font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* control row + cost box */
  .middle { display: grid; grid-template-columns: 1fr 310px; gap: 24px; align-items: start; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .version { font-weight: 600; font-size: 19px; display: flex; align-items: baseline; gap: 8px; }
  .version span { font-weight: 400; min-width: 50px; text-align: center; border-bottom: 2px dotted var(--navy); }
  .btn { border: 0; border-radius: 6px; padding: 6px 14px; font-weight: 600; font-size: 17px; }
  .btn.grey { background: var(--panel); color: var(--navy); }
  .btn.green { background: var(--green); color: var(--navy); }
  .btn.navy { background: var(--navy); color: var(--green); }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--navy); }
  .btn.danger { background: none; color: var(--danger); border: 1px solid var(--danger); }
  .btn:disabled { opacity: .5; cursor: progress; }

  .donuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
  .donut svg { width: 120px; height: 120px; }
  .donut .val { font-size: 24px; fill: var(--navy); font-family: inherit; }
  .donut p { margin: 6px 0 0; font-size: 13px; font-weight: 600; line-height: 1.2; }

  .cost { background: var(--panel); border-radius: 6px; padding: 12px 16px 16px; text-align: center; }
  .cost h3 { margin: 0 0 8px; font-size: 21px; font-weight: 600; }
  .cost dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 0 0 12px; text-align: left; }
  .cost dt { font-weight: 600; text-align: right; }
  .cost dd { margin: 0; border-bottom: 2px dotted var(--navy); font-variant-numeric: tabular-nums; }

  /* bids */
  .bids { margin-top: 20px; background: var(--panel); border-radius: 6px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 14px 0 20px; }
  .bid { padding: 0 20px; }
  .bid + .bid { border-left: 2px solid #555; }
  .bid h3 { text-align: center; margin: 0 0 14px; font-size: 22px; font-weight: 600; }
  .bid dl { display: grid; grid-template-columns: 1fr 1.1fr; gap: 8px 12px; margin: 0; font-size: 17px; }
  .bid dt { text-align: right; font-weight: 600; }
  .bid dd { margin: 0; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .bar { width: 96px; height: 14px; background: #777; border-radius: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 8px; }
  .no-results { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 14px; margin-top: 10px; }

  /* sign-in screen */
  .login { min-height: 70vh; display: grid; place-items: center; padding: 24px; }
  .login .card { background: var(--panel); border-radius: 10px; padding: 32px 36px; text-align: center; max-width: 380px; }
  .login h2 { margin: 0 0 6px; font-weight: 600; }
  .login p { color: var(--muted); margin: 0 0 20px; }
  .google-btn { display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 10px 18px; font-weight: 500; }

  /* dialogs */
  dialog { border: 0; border-radius: 10px; padding: 0; width: min(760px, 94vw); max-height: 88vh; color: var(--text); }
  dialog::backdrop { background: rgba(11, 34, 57, .45); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 1; }
  .dlg-head h3 { margin: 0; font-weight: 500; }
  .dlg-head button { background: none; border: 0; color: #fff; font-size: 22px; }
  .dlg-body { padding: 16px 20px; overflow: auto; max-height: calc(88vh - 120px); }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px; border-top: 1px solid #eee; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { font-weight: 600; background: #fafafa; }
  td a { color: var(--navy); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--panel); }
  .tag.ok { background: #d8f0de; } .tag.bad { background: #f6d6d3; }
  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 6px; border-bottom: 1px solid #eee; cursor: pointer; }
  .list-row:hover { background: #f6f7f8; }
  .list-row small { color: var(--muted); }

  fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 0 0 14px; padding: 8px 14px 12px; }
  legend { font-weight: 600; padding: 0 6px; text-transform: capitalize; }
  .field { display: grid; grid-template-columns: 1fr 200px; gap: 12px; align-items: center; padding: 4px 0; font-size: 14px; }
  .field input[type=number], .field input[type=text] { width: 100%; padding: 5px 8px; border: 1px solid #ccc; border-radius: 5px; font: inherit; }
  .field input[type=checkbox] { justify-self: start; width: 18px; height: 18px; }
  .errors { color: var(--danger); white-space: pre-wrap; font-size: 14px; }
  .ask input { width: 100%; padding: 8px 10px; font: inherit; border: 1px solid #ccc; border-radius: 6px; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 8px; max-width: min(640px, 92vw); white-space: pre-wrap; box-shadow: 0 6px 20px rgba(0,0,0,.2); z-index: 10; }
  #toast.error { background: var(--danger); }
  #busy { position: fixed; inset: 0; background: rgba(255,255,255,.55); display: grid; place-items: center; z-index: 9; font-weight: 600; }

  @media (max-width: 900px) {
    .uploads, .middle { grid-template-columns: 1fr; }
    .donuts { grid-template-columns: repeat(2, 1fr); }
    .bids { grid-template-columns: 1fr; }
    .bid + .bid { border-left: 0; border-top: 2px solid #999; padding-top: 14px; margin-top: 14px; }
    .brand h1 { font-size: 22px; }
  }
  @media print {
    .stripe, .icon-btn, .plain-icon, .controls .btn, .file-chip .plain-icon, .user { display: none !important; }
    .app { max-width: none; }
  }
</style>
</head>
<body>
<div class="stripe"></div>
<div class="app">
  <header>
    <div class="brand">
      <!-- Put your logo at assets/logo.png; the text is shown if the image is missing. -->
      <img src="assets/logo.png" alt="" onerror="this.remove()">
      <h1><b>TENDER</b> ESTIMATION</h1>
    </div>
    <div class="spacer"></div>
    <div id="signedInHeader" hidden style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <div class="project-name"><span id="projectName">–</span>
        <button class="plain-icon" id="renameBtn" title="Rename project">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>
        </button>
      </div>
      <button class="icon-btn" id="newBtn"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></span>New</button>
      <button class="icon-btn" id="projectsBtn"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="5" cy="7" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="17" r="1"/></svg></span>Projects</button>
      <button class="icon-btn" id="saveBtn"><span class="box"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2 2v4h8V5H7zm5 8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></span>Save</button>
      <button class="icon-btn" id="pdfBtn"><span class="box"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V8h4.5L13 3.5zM8 12v2h8v-2H8zm0 4v2h6v-2H8z"/></svg></span>PDF</button>
      <div class="user">
        <div class="who"><span id="avatar" class="avatar"></span><span id="userName"></span></div>
        <button class="plain-icon" id="logoutBtn" title="Sign out">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4H5v16h5"/><path d="M14 8l4 4-4 4M18 12H9"/></svg>
        </button>
      </div>
    </div>
  </header>

  <section id="loginView" class="login" hidden>
    <div class="card">
      <h2>Sign in</h2>
      <p>Use your Google account to open your tender projects.</p>
      <button class="google-btn" id="loginBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Sign in with Google
      </button>
    </div>
  </section>

  <main id="mainView" hidden>
    <div class="uploads">
      <div class="upload"><label>Tender</label><div class="file-chip"><span class="fname" id="f-tender"></span><button class="plain-icon" data-upload="tender" title="Upload tender PDF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5"/></svg></button></div></div>
      <div class="upload"><label>Catalog</label><div class="file-chip"><span class="fname" id="f-catalog"></span><button class="plain-icon" data-upload="catalog" title="Upload catalog CSV"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5"/></svg></button></div></div>
      <div class="upload"><label>Productivity</label><div class="file-chip"><span class="fname" id="f-productivity"></span><button class="plain-icon" data-upload="productivity" title="Upload productivity CSV"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5"/></svg></button></div></div>
      <input type="file" id="filePicker" hidden>
    </div>

    <div class="middle">
      <div>
        <div class="controls">
          <div class="version">Version <span id="versionNo">–</span></div>
          <button class="btn grey" id="historyBtn">Version History</button>
          <button class="btn green" id="paramsBtn">Edit parameters</button>
          <button class="btn navy" id="recomputeBtn">Re-compute</button>
        </div>
        <div class="donuts" id="donuts"></div>
      </div>
      <div class="cost">
        <h3>Cost Estimation</h3>
        <dl id="costs"></dl>
        <button class="btn navy" id="summaryBtn" style="font-size:15px">View detailed summary</button>
      </div>
    </div>

    <div class="bids" id="bids"></div>
  </main>
</div>

<!-- dialogs -->
<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlgTitle"></h3><button data-close aria-label="Close">×</button></div>
  <div class="dlg-body" id="dlgBody"></div>
  <div class="dlg-foot" id="dlgFoot"></div>
</dialog>
<div id="toast" hidden></div>
<div id="busy" hidden>Working…</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
