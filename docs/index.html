<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIDWISE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23022338'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='%238ac79c' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #022338; --green: #8ac79c; --green-dark: #4f9e6b; --green-pale: #a9d8b6;
    --win-1: #3ddc84; --win-2: #9be38f; --win-3: #e2c879;
    --amber: #e0b040; --red: #c95c4a; --slate: #b9c2cc;
    --panel: #e2e2e2; --line: #c4c4c4; --text: #022338; --muted: #5d6b78; --bg: #ffffff; --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Montserrat", system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, select { font: inherit; color: inherit; }

  .stripe { height: 34px; background: linear-gradient(90deg, var(--navy) 0 52.3%, var(--green) 52.3% 100%); }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 20px; padding: 10px 22px; background: var(--panel); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 36px; }
  .brand img { height: 46px; }
  .brand h1 { margin: 0; font-size: 34px; font-weight: 400; letter-spacing: .05em; }
  .brand h1 b { font-weight: 700; }
  .spacer { flex: 1; }
  .hdr-group { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .project-name { display: flex; align-items: center; gap: 6px; font-size: 22px; border-bottom: 3px dotted var(--navy); padding: 0 4px 2px; max-width: 340px; }
  .project-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; }
  .icon-btn .box { width: 32px; height: 32px; border: 2.5px solid var(--navy); border-radius: 8px; display: grid; place-items: center; background: #fff; }
  .icon-btn svg { width: 20px; height: 20px; }
  .plain-icon { background: none; border: 0; padding: 2px; display: grid; place-items: center; }
  .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; border: 0; display: grid; place-items: center; }
  .save-btn { background: var(--navy); color: var(--green); border: 0; border-radius: 8px; padding: 8px 26px; font-weight: 700; font-size: 20px; }
  .user { display: flex; align-items: center; gap: 10px; }
  .user .who { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 700; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--navy); object-fit: cover; background: var(--green); display: grid; place-items: center; font-weight: 700; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  body:not([data-page="dashboard"]) .only-dash { display: none !important; }
  body:not([data-page="params"]) .only-params { display: none !important; }
  body[data-page="dashboard"] .only-sub { display: none !important; }

  main { padding: 22px 22px 28px; }
  .btn { border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 16px; }
  .btn.grey { background: var(--panel); }
  .btn.green { background: var(--green); }
  .btn.navy { background: var(--navy); color: var(--green); }
  .btn.ghost { background: #fff; border: 1.5px solid var(--line); }
  .btn.small { font-size: 13px; padding: 5px 10px; }
  .btn:disabled { opacity: .5; cursor: progress; }

  /* ---------- dashboard ---------- */
  .uploads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-bottom: 20px; }
  .upload { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .upload label { font-weight: 700; font-size: 22px; }
  .file-chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 6px; padding: 4px 8px; }
  .file-chip .fname { flex: 1; min-width: 0; font-size: 20px; border-bottom: 3px dotted var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-chip .fname.empty { color: var(--muted); font-style: italic; font-size: 17px; }

  .dash-mid { display: grid; grid-template-columns: 220px minmax(330px, 1fr) 200px 400px; gap: 20px; align-items: stretch; }
  .side { display: flex; flex-direction: column; gap: 22px; padding-top: 8px; }
  .version { font-weight: 700; font-size: 22px; display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .version span { font-weight: 400; min-width: 90px; text-align: center; border-bottom: 3px dotted var(--navy); }
  .side .btn { font-size: 20px; padding: 9px 12px; text-align: center; }

  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; max-height: 400px; display: block; margin: 0 auto; }
  .chart .seg-label { font-size: 11px; fill: var(--navy); }
  .chart .center-title { font-size: 15px; font-weight: 700; font-style: italic; fill: var(--navy); }
  .chart .center-val { font-size: 17px; font-weight: 700; font-style: italic; fill: var(--navy); }

  .card { background: var(--panel); border-radius: 10px; padding: 14px 16px; }
  .counts { display: flex; flex-direction: column; justify-content: space-around; text-align: center; }
  .counts h4 { margin: 0; font-size: 17px; font-weight: 600; }
  .counts .big { font-size: 56px; font-weight: 700; line-height: 1.15; }
  .counts hr { border: 0; border-top: 2px solid #999; width: 100%; margin: 6px 0; }

  .cost { text-align: center; display: flex; flex-direction: column; }
  .cost h3 { margin: 0 0 10px; font-size: 26px; font-weight: 600; }
  .cost dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; margin: 0 0 14px; text-align: left; font-size: 20px; }
  .cost dt { font-weight: 700; text-align: right; }
  .cost dd { margin: 0; border-bottom: 3px dotted var(--navy); font-variant-numeric: tabular-nums; }
  .cost .btn { margin-top: auto; align-self: center; font-size: 18px; padding: 9px 28px; }

  .bids { margin-top: 20px; background: var(--panel); border-radius: 10px; display: grid; grid-template-columns: repeat(var(--bid-cols, 3), 1fr); padding: 18px 0 22px; }
  .bid { padding: 0 22px; }
  .bid + .bid { border-left: 3px solid #555; }
  .bid h3 { text-align: center; margin: 0 0 18px; font-size: 28px; font-weight: 600; }
  .bid dl { display: grid; grid-template-columns: 1fr 1.25fr; gap: 10px 14px; margin: 0; font-size: 20px; }
  .bid dt { text-align: right; font-weight: 700; }
  .bid dd { margin: 0; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { width: 110px; height: 18px; background: #777; border-radius: 10px; overflow: hidden; flex: none; }
  .bar i { display: block; height: 100%; border-radius: 10px; }
  .hint { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 14px; margin: 12px 0 0; }

  /* ---------- parameters page ---------- */
  .page-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 16px; }
  .page-title h2 { margin: 0; font-size: 26px; }
  .page-title p { margin: 0; color: var(--muted); font-size: 14px; }
  .param-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 18px; align-items: start; }
  .pcard { background: var(--panel); border-radius: 10px; padding: 14px 16px 16px; }
  .pcard h3 { margin: 0 0 4px; font-size: 19px; }
  .pcard .sub { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
  .prow { display: grid; grid-template-columns: 1fr 130px 70px 28px; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px dashed #bdbdbd; }
  .prow:last-of-type { border-bottom: 0; }
  .prow label { font-size: 15px; font-weight: 500; }
  .prow input[type=number], .prow input[type=text], .prow select { width: 100%; padding: 6px 8px; border: 1px solid #aaa; border-radius: 6px; background: #fff; text-align: right; }
  .prow input[type=text].left { text-align: left; grid-column: span 2; }
  .prow .unit { font-size: 13px; color: var(--muted); }
  .prow .del { background: none; border: 0; color: var(--danger); font-size: 20px; line-height: 1; padding: 0; }
  .prow .del:disabled { visibility: hidden; }
  .prow input.invalid { border-color: var(--danger); background: #fff3f2; }
  .prow input[type=checkbox] { width: 20px; height: 20px; justify-self: end; }
  .custom-tag { font-size: 10px; background: var(--green); border-radius: 8px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
  .add-row { display: grid; grid-template-columns: 1fr 130px 70px 28px; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 2px solid #c9c9c9; }
  .add-row input, .add-row select { width: 100%; padding: 6px 8px; border: 1px solid #aaa; border-radius: 6px; background: #fff; }
  .add-row button { background: var(--navy); color: var(--green); border: 0; border-radius: 6px; font-weight: 700; font-size: 18px; }
  .param-errors { background: #fff3f2; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; white-space: pre-wrap; font-size: 14px; }
  .readonly { grid-column: span 2; font-size: 14px; color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- summary page ---------- */
  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 16px; }
  .tile { background: var(--panel); border-radius: 10px; padding: 12px 14px; }
  .tile small { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .tile b { font-size: 24px; font-variant-numeric: tabular-nums; }
  .cost-strip { display: grid; grid-template-columns: repeat(4, 1fr) 1.4fr; gap: 14px; margin-bottom: 18px; }
  .cost-strip .tile b { font-size: 20px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .toolbar input[type=search] { padding: 8px 12px; border: 1px solid #aaa; border-radius: 8px; min-width: 240px; }
  .toolbar select { padding: 7px 10px; border: 1px solid #aaa; border-radius: 8px; background: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 16px; padding: 4px 11px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .table-wrap { overflow: auto; border: 1px solid #ddd; border-radius: 10px; max-height: calc(100vh - 380px); min-height: 240px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; }
  thead th { position: sticky; top: 0; background: var(--navy); color: #fff; font-weight: 600; cursor: pointer; user-select: none; z-index: 1; }
  thead th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: #f3f7f4; }
  tfoot td { position: sticky; bottom: 0; background: #eef3ef; font-weight: 700; border-top: 2px solid var(--navy); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .status i { width: 10px; height: 10px; border-radius: 50%; }
  .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }

  /* ---------- sign-in ---------- */
  .login { min-height: 70vh; display: grid; place-items: center; padding: 24px; }
  .login .card { text-align: center; max-width: 400px; padding: 34px 38px; }
  .login h2 { margin: 0 0 6px; }
  .login p { color: var(--muted); margin: 0 0 22px; }
  .google-btn { display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 11px 20px; font-weight: 600; }

  /* ---------- dialogs ---------- */
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(780px, 94vw); max-height: 88vh; color: var(--text); }
  dialog::backdrop { background: rgba(2, 35, 56, .45); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--navy); color: #fff; }
  .dlg-head h3 { margin: 0; font-weight: 600; }
  .dlg-head button { background: none; border: 0; color: #fff; font-size: 24px; }
  .dlg-body { padding: 16px 20px; overflow: auto; max-height: calc(88vh - 130px); }
  .dlg-body table th { position: static; background: #f4f4f4; color: var(--navy); cursor: default; }
  .dlg-body td { white-space: normal; vertical-align: top; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px; border-top: 1px solid #eee; }
  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 8px; border-bottom: 1px solid #eee; cursor: pointer; }
  .list-row:hover { background: #f4f7f5; }
  .list-row small { color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--panel); }
  .tag.ok { background: #d8f0de; } .tag.bad { background: #f6d6d3; }
  .ask input { width: 100%; padding: 9px 11px; border: 1px solid #bbb; border-radius: 8px; }
  td a { color: var(--navy); }

  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 11px 20px; border-radius: 10px; max-width: min(660px, 92vw); white-space: pre-wrap; box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 20; }
  #toast.error { background: var(--danger); }
  #busy { position: fixed; inset: 0; background: rgba(255,255,255,.55); display: grid; place-items: center; z-index: 19; font-weight: 700; }

  @media (max-width: 1300px) {
    .dash-mid { grid-template-columns: 200px 1fr 190px; }
    .dash-mid .cost { grid-column: 1 / -1; }
    .tiles { grid-template-columns: repeat(3, 1fr); }
    .cost-strip { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 860px) {
    .stripe { height: 14px; }
    .brand { gap: 16px; } .brand img { height: 34px; } .brand h1 { font-size: 24px; }
    .uploads, .dash-mid { grid-template-columns: 1fr; }
    .side { flex-direction: row; flex-wrap: wrap; gap: 10px; }
    .side .btn { font-size: 16px; }
    .bids { grid-template-columns: 1fr; }
    .bid + .bid { border-left: 0; border-top: 3px solid #999; padding-top: 16px; margin-top: 16px; }
    .param-grid { grid-template-columns: 1fr; }
    .prow, .add-row { grid-template-columns: 1fr 96px 58px 24px; }
    .tiles, .cost-strip { grid-template-columns: repeat(2, 1fr); }
  }
  @media print {
    .stripe, .icon-btn, .plain-icon, .user, .side .btn, .file-chip .plain-icon, .back-btn, .save-btn, .toolbar { display: none !important; }
    .table-wrap { max-height: none; overflow: visible; }
  }
</style>
</head>
<body data-page="dashboard">
<div class="stripe"></div>
<header>
  <div class="brand">
    <img src="assets/logo.png" alt="Equans Switzerland" onerror="this.remove()">
    <h1><b>BID</b>WISE</h1>
  </div>
  <div class="spacer"></div>
  <div id="signedInHeader" class="hdr-group" hidden>
    <button class="save-btn only-params" id="paramsSaveBtn">Save</button>
    <button class="back-btn only-sub" id="backBtn" title="Back to dashboard">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <div class="project-name"><span id="projectName">–</span>
      <button class="plain-icon only-dash" id="renameBtn" title="Rename project">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>
      </button>
    </div>
    <button class="icon-btn only-dash" id="newBtn"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></span>New</button>
    <button class="icon-btn only-dash" id="projectsBtn"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="5" cy="7" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="17" r="1"/></svg></span>Projects</button>
    <button class="icon-btn only-dash" id="saveBtn"><span class="box"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2 2v4h8V5H7zm5 8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></span>Save</button>
    <button class="icon-btn only-dash" id="pdfBtn"><span class="box"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V8h4.5L13 3.5zM8 12v2h8v-2H8zm0 4v2h6v-2H8z"/></svg></span>PDF</button>
    <div class="user">
      <div class="who"><span id="avatar" class="avatar"></span><span id="userName"></span></div>
      <button class="plain-icon" id="logoutBtn" title="Sign out">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 4H5v16h5"/><path d="M14 8l4 4-4 4M18 12H9"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- sign in -->
<section id="loginView" class="login" hidden>
  <div class="card">
    <h2>Sign in</h2>
    <p>Use your Google account to open your tender projects.</p>
    <button class="google-btn" id="loginBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </button>
  </div>
</section>

<!-- page 1: dashboard -->
<main id="page-dashboard" hidden>
  <div class="uploads">
    <div class="upload"><label>Tender</label><div class="file-chip"><span class="fname" id="f-tender"></span><button class="plain-icon" data-upload="tender" title="Upload tender PDF"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5"/></svg></button></div></div>
    <div class="upload"><label>Catalog</label><div class="file-chip"><span class="fname" id="f-catalog"></span><button class="plain-icon" data-upload="catalog" title="Upload catalog CSV"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5"/></svg></button></div></div>
    <div class="upload"><label>Productivity</label><div class="file-chip"><span class="fname" id="f-productivity"></span><button class="plain-icon" data-upload="productivity" title="Upload productivity CSV"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5"/></svg></button></div></div>
    <input type="file" id="filePicker" hidden>
  </div>

  <div class="dash-mid">
    <div class="side">
      <div class="version">Version <span id="versionNo">–</span></div>
      <button class="btn grey" id="historyBtn">Version History</button>
      <button class="btn green" id="paramsBtn">Edit parameters</button>
      <button class="btn navy" id="recomputeBtn">Re-compute</button>
    </div>
    <div class="chart" id="chart"></div>
    <div class="card counts">
      <div><h4>Priceable Positions</h4><div class="big" id="priceable">–</div></div>
      <hr>
      <div><h4>Materials Found</h4><div class="big" id="materials">–</div></div>
    </div>
    <div class="card cost">
      <h3>Cost Estimation</h3>
      <dl id="costs"></dl>
      <button class="btn navy" id="summaryBtn">View detailed summary</button>
    </div>
  </div>

  <div class="bids" id="bids"></div>
</main>

<!-- page 2: edit parameters -->
<main id="page-params" hidden>
  <div class="page-title">
    <h2>Project parameters</h2>
    <p>Changes are stored with the next <b>Re-compute</b> as a new version. Use <b>+</b> to add your own parameters.</p>
  </div>
  <div id="paramErrors" class="param-errors" hidden></div>
  <div class="param-grid" id="paramGrid"></div>
</main>

<!-- page 3: detailed summary -->
<main id="page-summary" hidden>
  <div class="page-title">
    <h2>Detailed summary</h2>
    <div class="toolbar" style="margin:0">
      <label for="summaryVersion" style="font-weight:600">Version</label>
      <select id="summaryVersion"></select>
    </div>
  </div>
  <div id="summaryBody"></div>
</main>

<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlgTitle"></h3><button data-close aria-label="Close">×</button></div>
  <div class="dlg-body" id="dlgBody"></div>
  <div class="dlg-foot" id="dlgFoot"></div>
</dialog>
<div id="toast" hidden></div>
<div id="busy" hidden>Working…</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
